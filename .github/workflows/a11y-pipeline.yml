name: Accessibility Audit & Remediation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit-and-fix:
    # Trigger on PRs targeting 'main' OR when a comment contains '/fix-a11y'
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/fix-a11y'))
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agents/accessibility-agent

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: agents/accessibility-agent/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Build Agent
        run: npm run build

      - name: Run Audit & AI Remediation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_URL: "http://127.0.0.1:8080/"
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          FIX_REQUESTED: ${{ contains(github.event.comment.body, '/fix-a11y') }}
        run: npm run ci:run